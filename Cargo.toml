[workspace]
members = ["crates/oxo-license", "crates/oxo-license-issuer"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Traitome <https://github.com/Traitome>"]
repository = "https://github.com/Traitome/oxo-dual-licenser"
homepage = "https://github.com/Traitome/oxo-dual-licenser"

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3"
rand = "0.8"
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
directories = "6.0"
