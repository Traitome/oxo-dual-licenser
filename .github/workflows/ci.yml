name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Sync version from tag ──────────────────────────────────────────────────
  sync-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Patch Cargo.toml versions
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/oxo-license/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/oxo-license-issuer/Cargo.toml
      - name: Patch CITATION.cff
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          DATE=$(date +%Y-%m-%d)
          sed -i "s/^version: .*/version: $VERSION/" CITATION.cff
          sed -i "s/^date-released: .*/date-released: \"$DATE\"/" CITATION.cff
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/oxo-license/Cargo.toml crates/oxo-license-issuer/Cargo.toml CITATION.cff
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main || true

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Security audit
        run: cargo audit
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Coverage
        run: cargo tarpaulin --workspace --out Xml --output-dir coverage/
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
        continue-on-error: true

  # ─── Linux builds ───────────────────────────────────────────────────────────
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Build
        run: cross build --release --target ${{ matrix.target }} -p oxo-license-issuer
      - name: Package binary
        run: |
          TARGET=${{ matrix.target }}
          mkdir -p dist
          cp target/$TARGET/release/oxo-license-issuer dist/oxo-license-issuer-$TARGET
      - uses: actions/upload-artifact@v4
        with:
          name: oxo-license-issuer-${{ matrix.target }}
          path: dist/

  # ─── macOS builds ───────────────────────────────────────────────────────────
  build-macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p oxo-license-issuer
      - name: Package binary
        run: |
          TARGET=${{ matrix.target }}
          mkdir -p dist
          cp target/$TARGET/release/oxo-license-issuer dist/oxo-license-issuer-$TARGET
      - uses: actions/upload-artifact@v4
        with:
          name: oxo-license-issuer-${{ matrix.target }}
          path: dist/

  # ─── Windows builds ─────────────────────────────────────────────────────────
  build-windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p oxo-license-issuer
      - name: Package binary
        shell: bash
        run: |
          TARGET=${{ matrix.target }}
          mkdir -p dist
          cp target/$TARGET/release/oxo-license-issuer.exe dist/oxo-license-issuer-$TARGET.exe
      - uses: actions/upload-artifact@v4
        with:
          name: oxo-license-issuer-${{ matrix.target }}
          path: dist/

  # ─── GitHub Release ─────────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Collect binaries and compute checksums
        run: |
          mkdir -p release-assets
          find artifacts/ -type f | xargs -I{} cp {} release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Install git-cliff
        run: cargo install git-cliff --locked
      - name: Generate changelog
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-assets/*

  # ─── Publish to crates.io ───────────────────────────────────────────────────
  publish-crate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish oxo-license
        run: cargo publish -p oxo-license --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish oxo-license-issuer
        run: cargo publish -p oxo-license-issuer --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ─── Deploy MkDocs ──────────────────────────────────────────────────────────
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Build docs
        run: cd docs/guide && mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/guide/site/
      - uses: actions/deploy-pages@v4
        id: deployment
